name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
           npm run build

      - name: Verify CV PDF
        run: |
          test -f ./dist/Antonio_Janach_CV.pdf
          SIZE=$(stat -c%s ./dist/Antonio_Janach_CV.pdf)
          echo "PDF size: ${SIZE} bytes"
          if [ "$SIZE" -gt 524288 ]; then
            echo "ERROR: PDF exceeds 500KB limit (${SIZE} bytes)"
            exit 1
          fi
          echo "PDF size OK: ${SIZE} bytes"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
